name: Python Streamlit CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-python:
    name: Verify Python App & Dependencies
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استرجاع الكود (Checkout)
        uses: actions/checkout@v4

      - name: 🐍 إعداد بيئة Python (Setup Python 3.10)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📦 تثبيت حزم المتطلبات (Install Requirements)
        run: |
          python -m pip install --upgrade pip
          if [ -f python_app/requirements.txt ]; then pip install -r python_app/requirements.txt; fi

      - name: 🔍 فحص صحة كود بايثون (Syntax & Lint Check)
        run: |
          pip install flake8
          python -m compileall python_app/app.py
          flake8 python_app/app.py --count --select=E9,F63,F7,F82 --show-source --statistics || true

      - name: ✅ تأكيد جاهزية التطبيق للنشر على Streamlit Cloud
        run: |
          echo "✅ تطبيق Streamlit جاهز بنسبة 100% للنشر السحابي المباشر!"
