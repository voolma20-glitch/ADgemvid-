name: Build Android APK (ADgemvid)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استرجاع الكود المصدري (Checkout)
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 إعداد بيئة Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🤖 قبول تراخيص Android SDK تلقائياً
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license" || true
          echo -e "\n8525616234f9e38c767e81da0392d192934208a0" > "$ANDROID_HOME/licenses/intel-android-extra-license" || true
          echo -e "\n33b6a2b649206b12a67e2a9a19dd168a7b76da0a" > "$ANDROID_HOME/licenses/google-gdk-license" || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 📦 تثبيت حزم المشروع
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 بناء ملفات الواجهة (Web Build)
        run: |
          npm run build

      - name: 📱 إعداد محرك Capacitor للأندرويد
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap add android || true
          npx cap sync android

      - name: 🔧 ضبط أذونات ملف Gradle
        run: |
          if [ -f android/gradlew ]; then
            chmod +x android/gradlew
          fi

      - name: 🚀 بناء ملف APK بصيغة Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🏷️ تجهيز ملف الـ APK النهائي
        run: |
          mkdir -p output_apk
          find android/app/build/outputs/apk/debug/ -name "*.apk" -exec cp {} output_apk/ADgemvid-Android-v1.0.apk \;
          echo "✅ تم تجميع ملف الـ APK بنجاح:"
          ls -lh output_apk/

      - name: 📤 رفع ملف الـ APK للتحميل المباشر (Download Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ADgemvid-Android-v1.0.apk
          path: output_apk/ADgemvid-Android-v1.0.apk
          retention-days: 30

      - name: 🌟 إنشاء Release ونشر الـ APK
        if: (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/ADgemvid-Android-v1.0.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "ADgemvid Android App Release v1.0.0"
          body: |
            ## 🎬 تطبيق ADgemvid الذكي لنظام أندرويد
            تم بناء ملف الـ APK بنجاح عبر GitHub Actions.
            - **اسم الملف:** `ADgemvid-Android-v1.0.apk`
            - **طريقة التثبيت:** قم بتحميل الملف وثبته على هاتفك مباشرة.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
