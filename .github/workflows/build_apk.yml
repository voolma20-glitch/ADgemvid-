name: Build Android APK (ADgemvid)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بضغطة زر واحدة من GitHub Actions

jobs:
  build-apk:
    name: Generate Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 استرجاع الكود المصدري (Checkout Code)
        uses: actions/checkout@v4

      - name: ☕ إعداد بيئة Java 17 (Setup Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🟢 إعداد بيئة Node.js (Setup Node)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 تثبيت حزم المشروع (Install Dependencies)
        run: |
          npm install --legacy-peer-deps

      - name: 🔨 بناء ملفات الواجهة (Build Web App)
        run: |
          npm run build

      - name: 📱 تثبيت محرك أندرويد عبر Capacitor (Setup Capacitor & Android Platform)
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --save
          npx cap add android || true
          npx cap sync android

      - name: 🔧 ضبط أذونات Gradle (Set Executable Permissions)
        run: |
          chmod +x android/gradlew

      - name: 🚀 بناء ملف APK بصيغة Debug (Assemble Android APK)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: 🏷️ تجهيز وتسمية ملف APK (Prepare Output File)
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output_apk/ADgemvid-Android-v1.0.apk

      - name: 📤 رفع ملف APK كملف جاهز للتحميل (Upload APK Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: ADgemvid-Android-APK
          path: output_apk/ADgemvid-Android-v1.0.apk
          retention-days: 30

      - name: 🌟 إنشاء إصدار GitHub Release ونشر الـ APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: output_apk/ADgemvid-Android-v1.0.apk
          tag_name: v1.0.0-${{ github.run_number }}
          name: "ADgemvid Android App Release v1.0.0"
          body: |
            ## 🎬 تطبيق ADgemvid الذكي لنظام أندرويد (Android APK)
            
            تم بناء ملف APK وتجميعه بنجاح عبر GitHub Actions.
            - **اسم الملف:** `ADgemvid-Android-v1.0.apk`
            - **النظام المدعوم:** Android 7.0 وأحدث.
            - **المميزات:** استوديو إعلانات الفيديو الذكي باللغة العربية، ومحرك التعليق الصوتي، والمونتاج بـ Audio Ducking.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
